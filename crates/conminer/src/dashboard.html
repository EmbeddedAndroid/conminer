        screen.cls = this.cls;
        screen.put(ch);
        i++;
        continue;
      }
      if (ch === "\n") { this.newline(); i++; continue; }
      if (ch === "\r") { this.col = 0; i++; continue; }
      if (ch === "\b") { this.col = Math.max(0, this.col - 1); i++; continue; }
      if (ch === "\t") { this.put("        ".slice(0, 8 - (this.col % 8))); i++; continue; }
      if (ch < " " && ch !== "\x1b") { i++; continue; }
      let j = i;
      while (j < text.length && text[j] >= " " && text[j] !== "\x1b") j++;
      this.put(text.slice(i, j));
      i = j;
    }
    this.schedule();
  },

  /// Handle a CSI sequence. Returns true when it was consumed here.
  ///
  /// Only the sequences a full-screen application actually needs: mode switch,
  /// cursor addressing, erase, and scroll regions. Anything else falls through
  /// to the scrollback path, which already handles SGR and EL.
  csi(params, final) {
    const p = (params || "").replace("?", "");
    const nums = p.split(";").map(x => parseInt(x || "0", 10));
    const n = (i, d) => (Number.isFinite(nums[i]) && nums[i] > 0 ? nums[i] : d);

    // Alternate screen: the boundary between "a log" and "an application".
    if (params === "?1049" || params === "?47" || params === "?1047") {
      if (final === "h") {
        const el = $("term");
        const cw = 8.05, chh = 18.1; // measured for the 12.5px mono stack
        const cols = Math.max(20, Math.floor(el.clientWidth / cw) - 1);
        const rows = Math.max(6, Math.floor(el.clientHeight / chh));
        screen.enter(rows, cols);
      } else if (final === "l") {
        screen.leave();
      }
      // The grid and the scrollback are different documents: switching between
      // them is the one case where every row really is new.
      this.full = true;
      this.schedule();
      return true;
    }
    if (params.startsWith("?")) return true; // other private modes: cursor vis etc.
    if (!screen.active) return false;

    switch (final) {
      case "H": case "f":
        screen.cur.r = Math.min(screen.rows - 1, n(0, 1) - 1);
        screen.cur.c = Math.min(screen.cols - 1, n(1, 1) - 1);
        return true;
      case "A": screen.cur.r = Math.max(0, screen.cur.r - n(0, 1)); return true;
      case "B": screen.cur.r = Math.min(screen.rows - 1, screen.cur.r + n(0, 1)); return true;
      case "C": screen.cur.c = Math.min(screen.cols - 1, screen.cur.c + n(0, 1)); return true;
      case "D": screen.cur.c = Math.max(0, screen.cur.c - n(0, 1)); return true;
      case "G": screen.cur.c = Math.min(screen.cols - 1, n(0, 1) - 1); return true;
      case "d": screen.cur.r = Math.min(screen.rows - 1, n(0, 1) - 1); return true;
      case "J": screen.eraseDisplay(nums[0] || 0); return true;
      case "K": screen.eraseLine(nums[0] || 0); return true;
      case "L": screen.scrollDown(n(0, 1)); return true;
      case "M": screen.scroll(n(0, 1)); return true;
      case "S": screen.scroll(n(0, 1)); return true;
      case "T": screen.scrollDown(n(0, 1)); return true;
      case "r":
        screen.top = Math.max(0, n(0, 1) - 1);
        screen.bot = Math.min(screen.rows - 1, n(1, screen.rows) - 1);
        return true;
      case "m": this.sgr(params); return true;
      default: return false;
    }
  },

  cur() { return this.lines[this.lines.length - 1]; },

  put(s) {
    const line = this.cur();
    let plain = line.map(x => x.t).join("");
    if (this.col < plain.length) {
      // Overwrite: rebuild the line as flat text, then re-tag the tail. Losing
      // the earlier colours of an overwritten line is a fair trade for showing
      // the same thing the board actually left on screen.
      plain = plain.slice(0, this.col) + s + plain.slice(this.col + s.length);
      line.length = 0;
      line.push({ t: plain.slice(0, this.col), c: "" }, { t: s, c: this.cls },
                { t: plain.slice(this.col + s.length), c: "" });
    } else {
      if (this.col > plain.length) line.push({ t: " ".repeat(this.col - plain.length), c: "" });
      line.push({ t: s, c: this.cls });
    }
    this.col += s.length;
  },

  truncate() {
    const line = this.cur();
    const plain = line.map(x => x.t).join("").slice(0, this.col);
    line.length = 0;
    if (plain) line.push({ t: plain, c: "" });
  },

  newline() {
    this.lines.push([]); this.col = 0;
    if (this.lines.length > this.cap) {
      const drop = this.lines.length - this.cap;
      this.lines.splice(0, drop);
      // The painter removes the same rows from the top of the DOM.
      this.base += drop;
    }
  },

  sgr(params) {
    for (const p of (params || "0").split(";")) {
      const n = parseInt(p || "0", 10);
      if (n === 0) this.cls = "";
      else if (n === 1) this.cls = (this.cls + " b").trim();
      else if (n === 2) this.cls = (this.cls + " dim").trim();
      else if (n >= 30 && n <= 37) this.cls = "c" + n;
      else if (n >= 90 && n <= 97) this.cls = "c" + (n - 60);
    }
  },

  /// One row of the terminal as a DOM node.
  row(line) {
    const div = document.createElement("div");
    for (const span of line) {
      if (!span.t) continue;
      if (span.c) {
        const s = document.createElement("span");
        s.className = span.c; s.textContent = span.t; div.appendChild(s);
      } else {
        div.appendChild(document.createTextNode(span.t));
      }
    }
    if (!line.length) div.appendChild(document.createTextNode("​"));
    return div;
  },

  paint() {
    if (!this.pending && !this.full) return;
    this.pending = false;
    this.paints++;
    const el = $("term");

    // While a full-screen application owns the terminal, paint ITS grid. The
    // scrollback is kept untouched underneath and returns intact on :q. The
    // grid is a screenful, so rebuilding it is cheap and stays simple; the next
    // scrollback paint after it has to be a full one, because none of these
    // rows are scrollback rows.
    if (screen.active) {
      const frag = document.createDocumentFragment();
      for (const line of screen.render()) frag.appendChild(this.row(line));
      el.innerHTML = "";
      el.appendChild(frag);
      this.full = true;
      return;
    }

    // Read once, BEFORE mutating: asking after would force a second layout.
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    const end = this.base + this.lines.length;

    // A burst can trim more rows than the DOM ever held; nothing there is
    // current any more, so start again rather than reconcile.
    if (!this.full && this.base - this.domBase >= el.childElementCount) this.full = true;

    let start;
    if (this.full) {
      el.innerHTML = "";
      this.domBase = this.base;
      start = this.base;
      this.full = false;
    } else {
      // The cap trimmed these off the model; take the same rows off the top.
      for (let drop = this.base - this.domBase; drop > 0; drop--) el.removeChild(el.firstChild);
      this.domBase = this.base;
      start = Math.max(this.dirty, this.base);
    }

    // Rows that already have a node are replaced in place; the rest are new and
    // go in together, so however much arrived costs one insertion.
    // The dirty rows are a suffix, so they are found by walking back from the
    // end: indexing a live collection from the front would make every paint cost
    // the whole scrollback again, which is the thing being fixed.
    const have = this.domBase + el.childElementCount;
    let node = null;
    if (have > start) {
      node = el.lastElementChild;
      for (let k = have - start; k > 1; k--) node = node.previousElementSibling;
    }
    const fresh = document.createDocumentFragment();
    for (let abs = start; abs < end; abs++) {
      const div = this.row(this.lines[abs - this.base]);
      if (node) {
        const next = node.nextElementSibling;
        el.replaceChild(div, node);
        node = next;
      } else {
        fresh.appendChild(div);
      }
    }
    el.appendChild(fresh);
    this.dirty = Infinity;

    // An application addresses a fixed grid: there is nothing to follow, and
    // auto-scrolling fights the cursor.
    if (state.follow && atBottom !== false) {
      el.scrollTop = el.scrollHeight;
    }
  },
};

// ---------------------------------------------------------------- console ---

// NOT named `open`: a top-level `function open()` becomes `window.open`,
// shadowing the browser's popup API. The card handler then called this
// function with the URL *string*, which has no `.device`, so the socket URL
// became /ws/console/undefined and the console rendered inline instead of in
// its own window. Renaming is the whole fix.
function openConsole(d) {
  if (state.ws) { state.ws.onclose = null; state.ws.close(); }
  // KEEP THE SCREEN when this is the same console coming back. Resetting on
  // every open is right for a different device and wrong for a resume: the
  // whole point of surviving a power cycle is that what you were reading is
  // still there when the board returns.
  const resuming = state.selected === d.device;
  state.selected = d.device;
  state.send = false;
  if (!resuming) term.reset();
  $("console").classList.remove("hidden");
  $("ctitle").textContent = d.device;
  {
    const t = $("ctitle");
    const old = t.parentNode.querySelector(".label");
    if (old) old.remove();
    if (d.nickname) {
      const tag = document.createElement("span");
      tag.className = "label";
      tag.textContent = d.nickname;
      t.after(tag);
    }
  }
  $("cline").textContent = d.line;
  // A console window should tell you how to reach the same port from a
  // terminal: this window is one way in, not the only one.
  const conn = $("cconn");
  if (conn) {
    conn.innerHTML = "";
    for (const [label, str] of connStrings(d)) {
      const b = document.createElement("button");
      b.className = "connbtn";
      b.title = `${label} — click to copy`;
      b.textContent = str;
      b.onclick = () => {
        navigator.clipboard.writeText(str).then(() => {
          const prev = b.textContent;
          b.textContent = "copied"; b.classList.add("copied");
          setTimeout(() => { b.textContent = prev; b.classList.remove("copied"); }, 1100);
        });
      };
      conn.appendChild(b);
    }
  }
  // TX is re-armed per connection. `disabled` was only ever set, never
  // cleared, so one read-only device left the control dead for the life of the
  // window -- which reads as "TX is broken" rather than "that port was
  // read-only".
  $("mode").disabled = false;
  setSend(false);
  wirePower(d);
  render();
  $("console").scrollIntoView({ behavior: "smooth", block: "nearest" });

  connectConsole();
}

/// Open the socket for whatever console is selected, and keep it open.
///
/// Separated from `openConsole` so a reconnection touches ONLY the socket: the
/// terminal buffer, the header and the power bar all belong to the console, not
/// to this particular TCP connection.
function connectConsole() {
  if (!state.selected) return;
  if (state.retry) { clearTimeout(state.retry); state.retry = null; }
  const device = state.selected;
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  // Ask for what was captured since we last saw anything. Only on a RESUME:
  // a first open wants the attachment's scrollback, not a replay of history.
  const since = state.waiting && state.cursor
    ? `?since=${encodeURIComponent(state.cursor)}` : "";
  const ws = new WebSocket(
    `${proto}//${location.host}/ws/console/${encodeURIComponent(device)}${since}`);
  ws.binaryType = "arraybuffer";
  state.ws = ws;
  ws.onopen = () => {
    if (state.waiting) {
      // Say WHERE the seam is. Boot output resuming mid-screen with no marker
      // reads as corruption, and an operator cannot tell what they missed.
      term.write(new TextEncoder().encode(
        `\r\n\u001b[36m── console back at ${new Date().toLocaleTimeString()} ──\u001b[0m\r\n`));
    }
    consoleLive();
  };

  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      const msg = JSON.parse(ev.data);
      if (msg.type === "hello") {
        if (msg.cursor) state.cursor = msg.cursor;
        $("cviewers").textContent = msg.viewers === 1 ? "you are the only viewer" : `${msg.viewers} viewers`;
        sharedNotice(msg.viewers);
        if (!msg.allow_tx) { $("mode").disabled = true; $("mode").textContent = "TX disabled by config"; }
      } else if (msg.type === "cursor") {
        // The anchor for a future reconnect, sent after the greeting so the
        // console is live before conminer touches its store.
        if (msg.cursor) state.cursor = msg.cursor;
      } else if (msg.type === "replay") {
        if (msg.cursor) state.cursor = msg.cursor;
        // SAY WHAT WAS MISSED AND HOW MUCH. Silently splicing captured output
        // into the screen would leave an operator unable to tell live from
        // history -- the whole point of the marker is that the seam is visible.
        const what = msg.lines === 0
          ? "nothing was captured while you were away"
          : `${msg.lines} line${msg.lines === 1 ? "" : "s"} captured while you were away` +
            (msg.truncated ? " (older lines trimmed)" : "");
        term.write(new TextEncoder().encode(
          `\r\n\u001b[36m── ${what} ──\u001b[0m\r\n`));
      } else if (msg.type === "error") {
        note(msg.message);
      }
      return;
    }
    term.write(new Uint8Array(ev.data));
  };
  // A CLOSE IS NOT AN ENDING. ser2net drops every client when the tty goes, and
  // it goes on every power cycle of a board whose controller is its UART. So the
  // page waits and dials again, for as long as the console stays selected.
  ws.onclose = () => {
    if (state.ws !== ws) return;          // superseded by a newer socket
    state.ws = null;
    if (!state.selected) return;          // the operator closed it: respect that
    consoleWaiting("connection closed; waiting for the console to come back");
    scheduleReconnect();
  };
}

/// The console is selected but has no socket: say so, stop offering TX, and
/// keep everything the operator was looking at.
function consoleWaiting(why) {
  state.waiting = true;
  setSend(false);
  const pill = $("cstatus");
  if (pill) {
    pill.textContent = "waiting for the console";
    pill.className = "pill warn";
    pill.title = why;
  }
  note(why, true);
}

function consoleLive() {
  state.waiting = false;
  state.attempt = 0;
  const pill = $("cstatus");
  if (pill) { pill.className = "pill hidden"; }
  note("");
}

/// Dial again, backing off a little, but never giving up while it is selected.
///
/// A board can be off for a second (reset) or for an afternoon (somebody went
/// home); the page has to behave the same in both cases, so the interval is
/// capped rather than exponential without bound.
function scheduleReconnect() {
  if (state.retry || !state.selected) return;
  state.attempt = Math.min(state.attempt + 1, 5);
  const wait = [400, 800, 1200, 2000, 3000][state.attempt - 1] || 3000;
  state.retry = setTimeout(() => { state.retry = null; connectConsole(); }, wait);
}

/// The device is back in the snapshot: dial now rather than waiting out a
/// backoff the operator can see is over.
function reconnectNow() {
  if (!state.selected || state.ws) return;
  if (state.retry) { clearTimeout(state.retry); state.retry = null; }
  state.attempt = 0;
  connectConsole();
}

function sharedNotice(viewers) {
  // Nothing here locks the line. Saying so is the honest alternative to
  // pretending the console is exclusively yours.
  $("sharedtext").textContent =
    `minerd is capturing this port, and nothing locks it: other viewers and any agent can transmit at the same time as you.` +
    (viewers > 1 ? ` ${viewers} browsers are attached right now.` : "");
}

function closeConsole(why) {
  if (state.ws) { state.ws.onclose = null; state.ws.close(); state.ws = null; }
  if (why) note(why);
  state.selected = null; setSend(false);
  $("power").classList.add("hidden");
  $("console").classList.add("hidden");
  render();
}

function setSend(on) {
  state.send = on && !$("mode").disabled;
  $("mode").textContent = state.send ? "Sending (keystrokes go to the board)" : "Watching (read-only)";
  $("mode").className = state.send ? "primary" : "";
  $("typehint").classList.toggle("hidden", !state.send);
  $("term").style.cursor = state.send ? "text" : "default";
  if (state.send) $("term").focus();
}


function tx(bytes) {
  if (!state.send || !state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  state.ws.send(bytes);
}

// ---- hardware controls ---------------------------------------------------
// Every button goes to dashd, which forwards to mcpd, so a press is the same
// actuation an agent performs: the epoch opens and the event lands on the
// timeline. The button reports what actually happened rather than assuming.
async function actOn(btn, url, what, msgEl, scope) {
  const all = scope.querySelectorAll(".act");
  all.forEach(b => { b.disabled = true; });
  btn.classList.add("busy");
  msgEl.textContent = `${what}…`;
  try {
    const r = await fetch(url, { method: "POST" });
    const body = await r.json().catch(() => ({}));
    const ok = r.ok && body.ok !== false;
    btn.classList.add(ok ? "ok" : "fail");
    msgEl.textContent = ok
      ? `${what}: epoch ${body.result?.boot_id ?? "opened"}`
      : `${what} failed: ${body.error || body.result?.error?.message || r.status}`;
  } catch (e) {
    btn.classList.add("fail");
    msgEl.textContent = `${what} failed: ${e}`;
  } finally {
    setTimeout(() => {
      btn.classList.remove("busy", "ok", "fail");
      all.forEach(b => { b.disabled = false; });
    }, 1600);
  }
}

async function act(btn, url, what) {
  const sel = "#power .act";
  document.querySelectorAll(sel).forEach(b => { b.disabled = true; });
  btn.classList.add("busy");
  $("powermsg").textContent = `${what}…`;
  // A power hook can block: the controller's readback is unreliable, and mcpd
  // enforces its own timeout server-side. Without a client deadline the panel
  // just sits greyed out forever and looks broken, so always give the UI a way
  // back even when the request never settles.
  const ctl = new AbortController();
  const deadline = setTimeout(() => ctl.abort(), 45000);
  try {
    const r = await fetch(url, { method: "POST", signal: ctl.signal });
    const body = await r.json().catch(() => ({}));
    const ok = r.ok && body.ok !== false;
    btn.classList.add(ok ? "ok" : "fail");
    $("powermsg").textContent = ok
      ? `${what}: epoch ${body.result?.boot_id ?? "opened"}`
      : `${what} failed: ${body.error || body.result?.error?.message || r.status}`;
  } catch (e) {
    btn.classList.add("fail");
    $("powermsg").textContent = e.name === "AbortError"
      ? `${what}: no answer after 45s — check the controller`
      : `${what} failed: ${e}`;
  } finally {
    clearTimeout(deadline);
    setTimeout(() => {
      btn.classList.remove("busy", "ok", "fail");
      // Re-query: a live device update can rebuild the panel mid-flight, and
      // re-enabling a detached node list leaves the visible buttons dead.
      document.querySelectorAll(sel).forEach(b => { b.disabled = false; });
    }, 1600);
  }
}

function wirePower(d) {
  const bar = $("power");
  const has = d.has_power_hook || (d.boot_modes || []).length > 0;
  bar.classList.toggle("hidden", !has);
  if (!has) return;

  // Say WHICH board these buttons drive, and record it in the DOM.
  //
  // There is one power bar, and wirePower rebinds it to whichever console was
  // opened last. With two controllers on a bench that is a real hazard: the
  // panel looked identical whichever board it was about to actuate, and the
  // binding lived in invisible state. Now the target is named to the operator
  // and readable by a test, so "did the click hit the right board?" has an
  // answer instead of a hope.
  bar.dataset.device = d.device;
  // Bound now, so it is safe to use. Before this runs the bar has no device and
  // must not be clickable -- see the guard where it is hidden.
  for (const b of bar.querySelectorAll("[data-power]")) b.disabled = false;
  const target = $("powertarget");
  // The port, always: this line names the board you are about to actuate.
  if (target) {
    target.textContent = d.device.split("/").pop()
      + (d.nickname ? ` (${d.nickname})` : "");
  }

  for (const b of bar.querySelectorAll("[data-power]")) {
    b.dataset.device = d.device;
    b.style.display = d.has_power_hook ? "" : "none";
    b.onclick = () => act(b, `/api/power/${encodeURIComponent(d.device)}/${b.dataset.power}`,
                          `power ${b.dataset.power}`);
  }
  const modes = $("modes");
  modes.innerHTML = "";
  const list = d.boot_modes || [];
  $("modesep").style.display = list.length && d.has_power_hook ? "" : "none";
  $("modelabel").style.display = list.length ? "" : "none";
  for (const m of list) {
    const b = document.createElement("button");
    b.className = "act";
    b.textContent = m;
    b.title = `Bring the board up in ${m}`;
    b.onclick = () => act(b, `/api/boot_mode/${encodeURIComponent(d.device)}/${encodeURIComponent(m)}`,
                          m);
    modes.appendChild(b);
  }
}

$("mode").onclick = () => setSend(!state.send);
$("follow").onclick = () => {
  state.follow = !state.follow;
  $("follow").textContent = state.follow ? "Following" : "Paused";
  $("follow").className = state.follow ? "" : "primary";
  if (state.follow) $("term").scrollTop = $("term").scrollHeight;
};
$("clear").onclick = () => term.reset();
$("close").onclick = () => closeConsole(null);
$("save").onclick = () => {
  const blob = new Blob(term.raw, { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${state.selected || "console"}.log`;
  a.click(); URL.revokeObjectURL(a.href);
};
/// Show a conminer message beside the console rather than writing it into the
/// stream. Fades after a few seconds so a transient reconnect does not leave a
/// permanent mark on a human's screen.
let noteTimer = null;
function note(msg, warn) {
  const el = $("cnote");
  if (!el) return;
  el.textContent = msg;
  el.className = "cnote show" + (warn ? " warn" : "");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { el.className = "cnote"; }, 6000);
}


// Direct typing into the terminal, so muscle memory from minicom works.
$("term").addEventListener("keydown", (e) => {
  if (!state.send) return;
  if (e.metaKey || e.altKey) return;
  if (e.ctrlKey) {
    const k = e.key.toLowerCase();
    if (k >= "a" && k <= "z") {
      e.preventDefault();
      tx(new Uint8Array([k.charCodeAt(0) - 96]));
    }
    return;
  }
  // Full xterm key encoding. Anything missing here is a key the board simply
  // never receives: Home/End/Delete are what break line editing, and the
  // function keys are what break menuconfig and vim's help. Tab is already
  // here, which is why completion works -- but it MUST keep preventDefault or
  // the browser steals it for focus navigation.
  const map = {
    Enter: [0x0d], Backspace: [0x7f], Tab: [0x09], Escape: [0x1b],
    ArrowUp: [0x1b, 0x5b, 0x41], ArrowDown: [0x1b, 0x5b, 0x42],
    ArrowRight: [0x1b, 0x5b, 0x43], ArrowLeft: [0x1b, 0x5b, 0x44],
    Home: [0x1b, 0x5b, 0x48], End: [0x1b, 0x5b, 0x46],
    Insert: [0x1b, 0x5b, 0x32, 0x7e], Delete: [0x1b, 0x5b, 0x33, 0x7e],
    PageUp: [0x1b, 0x5b, 0x35, 0x7e], PageDown: [0x1b, 0x5b, 0x36, 0x7e],
    // SS3 for F1-F4, CSI for the rest, as xterm sends them.
    F1: [0x1b, 0x4f, 0x50], F2: [0x1b, 0x4f, 0x51],
    F3: [0x1b, 0x4f, 0x52], F4: [0x1b, 0x4f, 0x53],
    F5: [0x1b, 0x5b, 0x31, 0x35, 0x7e], F6: [0x1b, 0x5b, 0x31, 0x37, 0x7e],
    F7: [0x1b, 0x5b, 0x31, 0x38, 0x7e], F8: [0x1b, 0x5b, 0x31, 0x39, 0x7e],
    F9: [0x1b, 0x5b, 0x32, 0x30, 0x7e], F10: [0x1b, 0x5b, 0x32, 0x31, 0x7e],
    F11: [0x1b, 0x5b, 0x32, 0x33, 0x7e], F12: [0x1b, 0x5b, 0x32, 0x34, 0x7e],
  };
  // Shift-Tab is its own sequence, and is how you go backwards in a TUI.
  if (e.key === "Tab" && e.shiftKey) {
    e.preventDefault();
    tx(new Uint8Array([0x1b, 0x5b, 0x5a]));
    return;
  }
  if (map[e.key]) { e.preventDefault(); tx(new Uint8Array(map[e.key])); return; }
  if (e.key.length === 1) { e.preventDefault(); tx(new TextEncoder().encode(e.key)); }
});

// A window opened with ?console=<device> is a single console, not the bench.
const solo = new URLSearchParams(location.search).get("console");
if (solo) {
  document.querySelector("main").classList.add("solo");
  document.title = `${solo.split("/").pop()} · conminer`;
}

// ANY press in the rack freezes the redraw for a moment.
//
// Not only the label chips: every control on a card is inside the grid that
// `render()` empties, so a device event landing between mousedown and mouseup
// takes the button out from under the pointer and the click is never delivered.
// Capture phase, so it runs before the control's own handler.
$("grid").addEventListener("mousedown", () => holdRender(600), true);

feed();
fetch("/api/devices").then(r => r.json()).then(s => {
  ingest(s);
  $("txmode").textContent = s.allow_tx ? "TX enabled" : "read-only server";
  $("txmode").className = "pill " + (s.allow_tx ? "warn" : "ok");
  $("slots").textContent = `ser2net: ${s.max_connections} clients/port`;
  render();
});
</script>
</body>
</html>
