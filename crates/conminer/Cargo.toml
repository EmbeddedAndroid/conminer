[package]
name = "conminer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Serial console template miner for LLM agents — discoveryd, minerd, mcpd, ingest"
default-run = "conminer"
# `benches/pipeline.rs` is declared as a [[test]] below (it is a harness test
# gated on `--ignored`, not a criterion bench), so auto-discovery would claim
# the same file for a second target.
autobenches = false

[lib]
name = "conminer"
path = "src/lib.rs"

[[bin]]
name = "conminer"
path = "src/main.rs"

[dependencies]
conminer-core = { path = "../conminer-core" }
conminer-mcp = { path = "../conminer-mcp" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
regex.workspace = true
rusqlite.workspace = true
globset.workspace = true
libc.workspace = true
axum.workspace = true
futures.workspace = true
async-stream.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
futures-util.workspace = true
sha2.workspace = true
hex.workspace = true
conminer-testkit = { path = "../conminer-testkit" }
conminer-mcp = { path = "../conminer-mcp" }
conminer-core = { path = "../conminer-core" }
proptest.workspace = true
tempfile.workspace = true
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
regex.workspace = true
serde_json.workspace = true
flate2.workspace = true
libc.workspace = true

# §13 test-suite catalog — one named target per suite.
