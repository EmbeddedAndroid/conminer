[workspace]
resolver = "2"
members = [
    "crates/conminer-core",
    "crates/conminer-testkit",
    "crates/conminer-mcp",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/EmbeddedAndroid/conminer"
description = "Drain-style streaming template miner and query service for serial console logs"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
regex = "1"
# Pure-Rust USB. Used for FTDI CBUS bit-bang on Bughopper-class controllers:
# the whole operation is one vendor control transfer (SET_BITMODE), so an FTDI
# library would be overkill -- and being pure Rust keeps libusb and Python out
# of the runtime image entirely.
nusb = "0.1"
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
globset = "0.4"
once_cell = "1"
memchr = "2"
bytes = "1"
tempfile = "3"
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
libc = "0.2"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "ws"] }
async-stream = "0.3"
futures = "0.3"
